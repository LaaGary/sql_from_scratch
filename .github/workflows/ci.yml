name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run the test suite
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.js; do
            echo "== $file"
            node --test "$file"
          done

      - name: Build the tutorial website
        run: node tools/build-docs.mjs

      - name: Check the site bundle is loadable
        run: node --check docs/assets/sql-engine.js
